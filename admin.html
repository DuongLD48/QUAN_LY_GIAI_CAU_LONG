<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ngọc Phát Sunday - Bảng Quản Trị</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%2300b4d8'/><text x='50' y='68' font-size='60' text-anchor='middle'>🏸</text></svg>">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Firebase SDK Compat via CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- ================= PIN AUTH MODAL ================= -->
  <div id="pin-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl text-center modal-container">
      <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-500/30">
        <i class="fa-solid fa-lock text-2xl"></i>
      </div>
      <h2 class="text-xl font-bold tracking-tight text-white mb-1">Xác Thực Ban Tổ Chức</h2>
      <p class="text-xs text-slate-400 mb-6">Vui lòng nhập mã PIN để vào trang Quản trị giải đấu (Mặc định: 123456)</p>
      
      <form id="pin-form" class="space-y-4">
        <div>
          <input 
            type="password" 
            id="pin-input" 
            maxlength="10" 
            placeholder="••••••" 
            class="w-full text-center tracking-[0.5em] text-2xl font-mono py-3 px-4 rounded-xl bg-slate-900/80 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
            required
            autofocus
          >
          <p id="pin-error" class="text-xs text-rose-400 mt-2 hidden">Mã PIN không chính xác! Vui lòng thử lại.</p>
        </div>
        
        <button 
          type="submit" 
          class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold shadow-lg transition active:scale-[0.98]"
        >
          Xác Nhận & Mở Khóa
        </button>
      </form>
      
      <div class="mt-6 pt-4 border-t border-slate-700/50">
        <a href="index.html" class="text-xs text-slate-400 hover:text-white transition flex items-center justify-center gap-1">
          <i class="fa-solid fa-arrow-left"></i> Quay lại trang người xem
        </a>
      </div>
    </div>
  </div>

  <!-- ================= ADMIN CONTENT (Hidden until authenticated) ================= -->
  <div id="admin-app" class="hidden flex-grow flex flex-col">
    
    <!-- Top Admin Bar (Compact Tab Bar) -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 py-2">
      <div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 flex items-center justify-between gap-2 overflow-x-auto scrollbar-none">
        <!-- Admin Tabs (Responsive Horizontal Scrollable Bar on Mobile) -->
        <nav class="flex items-center space-x-1 sm:space-x-2 text-[11px] font-bold shrink-0 overflow-x-auto scrollbar-none py-0.5">
          <button id="admin-tab-scores" class="admin-tab-btn active px-2.5 py-1.5 rounded-lg bg-blue-600 text-white font-bold transition flex items-center gap-1.5 text-xs sm:text-[11px] whitespace-nowrap shrink-0">
            <i class="fa-solid fa-scoreboard"></i>
            <span>Nhập Tỷ Số</span>
          </button>
          <button id="admin-tab-teams" class="admin-tab-btn px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 transition flex items-center gap-1.5 text-xs sm:text-[11px] whitespace-nowrap shrink-0">
            <i class="fa-solid fa-users"></i>
            <span>Đội Hình & VĐV</span>
          </button>
          <button id="admin-tab-schedule" class="admin-tab-btn px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 transition flex items-center gap-1.5 text-xs sm:text-[11px] whitespace-nowrap shrink-0">
            <i class="fa-solid fa-clock"></i>
            <span>Lịch & Sân Đấu</span>
          </button>
          <button id="admin-tab-settings" class="admin-tab-btn px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 transition flex items-center gap-1.5 text-xs sm:text-[11px] whitespace-nowrap shrink-0">
            <i class="fa-solid fa-sliders"></i>
            <span>Cài Đặt & Thể Thức</span>
          </button>
        </nav>

        <!-- Action Buttons -->
        <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
          <a href="index.html" target="_blank" class="px-2.5 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs sm:text-[11px] font-semibold transition flex items-center gap-1.5 whitespace-nowrap shrink-0" title="Xem Trực Tiếp">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
            <span class="hidden md:inline">Xem Trực Tiếp</span>
          </a>
          <button id="btn-lock" class="px-2.5 py-1.5 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 text-xs sm:text-[11px] font-semibold transition flex items-center gap-1.5 whitespace-nowrap shrink-0" title="Khóa Quản Trị">
            <i class="fa-solid fa-lock"></i>
            <span class="hidden md:inline">Khóa</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Admin Container -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow">
      
      <!-- SUB-TAB 1: NHẬP TỶ SỐ TRẬN ĐẤU -->
      <section id="admin-section-scores" class="admin-content space-y-4">
        <!-- Nạp động từ components/admin/scores/scores.html -->
      </section>

      <!-- SUB-TAB 2: QUẢN LÝ ĐỘI HÌNH & VĐV -->
      <section id="admin-section-teams" class="admin-content hidden space-y-6">
        <!-- Nạp động từ components/admin/teams/teams.html -->
      </section>

      <!-- SUB-TAB 3: CHỈNH SỬA LỊCH & SÂN ĐẤU -->
      <section id="admin-section-schedule" class="admin-content hidden space-y-6">
        <!-- Nạp động từ components/admin/schedule/schedule.html -->
      </section>

      <!-- SUB-TAB 4: CÀI ĐẶT THỂ THỨC & NẠP DỮ LIỆU -->
      <section id="admin-section-settings" class="admin-content hidden space-y-6">
        <!-- Nạp động từ components/admin/settings/settings.html -->
      </section>

    </main>

  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Application Shared Scripts -->
  <script src="js/data.js?v=2.1"></script>
  <script src="js/firebase-env.js?v=2.1"></script>
  <script src="js/firebase-config.js?v=2.1"></script>
  <script src="js/utils.js?v=2.1"></script>
  <script src="js/component-loader.js?v=2.1"></script>

  <!-- Admin Component Controllers -->
  <script src="components/admin/scores/scores.js?v=2.1"></script>
  <script src="components/admin/teams/teams.js?v=2.1"></script>
  <script src="components/admin/schedule/schedule.js?v=2.1"></script>
  <script src="components/admin/settings/settings.js?v=2.1"></script>

  <!-- Admin Core Orchestrator -->
  <script src="js/admin-core.js?v=2.1"></script>
</body>
</html>
